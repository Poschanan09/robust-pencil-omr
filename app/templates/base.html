<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Robust Pencil OMR System{% endblock %} - KMUTT ICE415</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Kalam, Mali, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Kalam:wght@400;700&family=Mali:wght@400;500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Mali', 'Sarabun', '-apple-system', 'cursive', 'sans-serif'],
                        display: ['Kalam', 'Mali', 'cursive'],
                        mono: ['JetBrains Mono', 'Consolas', 'monospace']
                    },
                    colors: {
                        ground: '#f7f2e7',
                        ink: {
                            DEFAULT: '#38352f',
                            muted: '#514d44'
                        },
                        line: '#b3ac9d',
                        accent: {
                            DEFAULT: '#9e3a2e',
                            hover: '#873226',
                            light: '#fbf0ee'
                        },
                        annotation: {
                            DEFAULT: '#344c69',
                            hover: '#293d54',
                            light: '#eef3f8'
                        },
                        highlight: '#f0dfa0',
                        scrap: '#fcf8ef'
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full flex flex-col font-sans text-ink antialiased selection:bg-highlight selection:text-ink">
    <!-- Navigation Bar (Working Sheet Header) -->
    <header class="bg-scrap border-b-2 border-line/70 sticky top-0 z-40 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 sm:px-6">
            <div class="flex justify-between h-16 items-center">
                <!-- Brand / Logo -->
                <div class="flex items-center space-x-3">
                    <a href="/" class="flex items-center space-x-2.5 group">
                        <!-- Hand-sketched Logo Box -->
                        <div class="w-9 h-9 rounded-md bg-scrap border-2 border-ink flex items-center justify-center text-accent shadow-[2px_2px_0_#38352f] group-hover:rotate-2 transition-transform">
                            <i class="fa-solid fa-pencil text-base"></i>
                        </div>
                        <div class="flex items-baseline space-x-2">
                            <span class="text-lg font-bold font-display tracking-wide text-ink">Robust Pencil OMR</span>
                            <span class="text-[11px] font-mono px-2 py-0.5 rounded border border-line bg-ground text-annotation font-semibold shadow-[1px_1px_0_#b3ac9d]">
                                ICE415
                            </span>
                        </div>
                    </a>
                </div>

                <!-- Navigation Links -->
                <nav class="flex items-center space-x-1 sm:space-x-2 text-sm font-display font-bold">
                    <a href="/" class="px-3 py-1.5 rounded text-ink-muted hover:text-ink hover:bg-highlight/60 transition-colors">
                        Dashboard
                    </a>
                    <a href="/upload" class="px-3 py-1.5 rounded text-ink-muted hover:text-ink hover:bg-highlight/60 transition-colors">
                        Upload & Scan
                    </a>
                    <a href="/results" class="px-3 py-1.5 rounded text-ink-muted hover:text-ink hover:bg-highlight/60 transition-colors">
                        All Results
                    </a>
                    <a href="/download-template" download class="ml-2 inline-flex items-center px-3.5 py-1.5 rounded text-xs font-mono font-bold bg-scrap text-ink border-2 border-ink shadow-[2px_2px_0_#38352f] hover:translate-x-[1px] hover:translate-y-[1px] hover:shadow-[1px_1px_0_#38352f] transition-all">
                        <i class="fa-solid fa-file-arrow-down mr-1.5 text-accent"></i>A4 Sheet PDF
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t-2 border-dashed border-line/80 mt-auto py-6 text-xs text-ink-muted bg-scrap/60">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-2 font-display text-sm">
                <span class="font-bold text-accent">✎ ICE415 Digital Image Processing</span>
                <span>•</span>
                <span>Department of Computer Engineering, KMUTT</span>
            </div>
            <div class="flex items-center space-x-3 text-annotation font-mono text-[11px]">
                <span>100% Classical DIP</span>
                <span>•</span>
                <span>Dual-Threshold &Delta;F</span>
                <span>•</span>
                <span>OpenCV + FastAPI</span>
            </div>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
