<!DOCTYPE html>
<html lang="th" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Robust Pencil OMR System{% endblock %} - KMUTT ICE415</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter & Sarabun -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Sarabun', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Consolas', 'Menlo', 'monospace']
                    },
                    colors: {
                        accent: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            600: '#1d4ed8',
                            700: '#1e40af',
                            800: '#1e3a8a',
                            900: '#172554'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full flex flex-col font-sans text-slate-800 antialiased bg-slate-50 selection:bg-slate-200">
    <!-- Navigation Bar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 sm:px-6">
            <div class="flex justify-between h-14 items-center">
                <div class="flex items-center space-x-3">
                    <a href="/" class="flex items-center space-x-2.5">
                        <div class="w-8 h-8 rounded-lg bg-slate-900 flex items-center justify-center text-white">
                            <i class="fa-solid fa-square-check text-sm"></i>
                        </div>
                        <div class="flex items-baseline space-x-2">
                            <span class="text-sm font-semibold tracking-tight text-slate-900">Robust Pencil OMR</span>
                            <span class="text-[11px] font-mono px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 border border-slate-200">KMUTT ICE415</span>
                        </div>
                    </a>
                </div>

                <nav class="flex items-center space-x-1 sm:space-x-1.5 text-xs font-medium">
                    <a href="/" class="px-2.5 py-1.5 rounded-md text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-colors">
                        Dashboard
                    </a>
                    <a href="/upload" class="px-2.5 py-1.5 rounded-md text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-colors">
                        Upload & Scan
                    </a>
                    <a href="/results" class="px-2.5 py-1.5 rounded-md text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-colors">
                        All Results
                    </a>
                    <a href="/download-template" download class="ml-2 inline-flex items-center px-3 py-1.5 rounded-md text-slate-700 bg-slate-100 hover:bg-slate-200 border border-slate-200 transition-colors">
                        <i class="fa-regular fa-file-pdf mr-1.5 text-slate-500"></i>Download A4 Sheet
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 mt-auto py-5 text-xs text-slate-500">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="flex items-center space-x-2">
                <span class="font-medium text-slate-700">ICE415 Digital Image Processing</span>
                <span>•</span>
                <span>Department of Computer Engineering, KMUTT</span>
            </div>
            <div class="flex items-center space-x-3 text-slate-400 font-mono text-[11px]">
                <span>100% Classical DIP</span>
                <span>•</span>
                <span>Tri-State Decision Logic</span>
                <span>•</span>
                <span>FastAPI + OpenCV</span>
            </div>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
